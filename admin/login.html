<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login - Premium Panel</title>
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <!-- Custom CSS -->
    <link rel="stylesheet" href="css/style.css">
    <style>
        body {
            background-color: #f1f5f9;
            background-image: radial-gradient(at 0% 0%, rgba(15, 23, 42, 0.05) 0px, transparent 50%),
                              radial-gradient(at 100% 100%, rgba(15, 23, 42, 0.05) 0px, transparent 50%);
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }
        .login-card {
            background: #ffffff;
            border: 1px solid #e2e8f0;
            border-radius: 20px;
            width: 100%;
            max-width: 420px;
            padding: 40px;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1), 0 10px 10px -5px rgba(0, 0, 0, 0.04);
        }
        .login-logo {
            font-size: 2.5rem;
            color: #0f172a;
            margin-bottom: 2rem;
            text-align: center;
        }
        .form-control-login {
            background: #f8fafc;
            border: 1px solid #e2e8f0;
            color: #1e293b;
            padding: 12px 15px;
            border-radius: 12px;
        }
        .form-control-login:focus {
            background: #fff;
            border-color: #0d6efd;
            box-shadow: 0 0 0 4px rgba(13, 110, 253, 0.1);
        }
        .login-label {
            color: #475569;
            font-size: 0.85rem;
            font-weight: 600;
            margin-bottom: 8px;
        }
        .btn-login {
            background: #0f172a;
            border: none;
            padding: 12px;
            border-radius: 12px;
            font-weight: 600;
            letter-spacing: 0.5px;
            margin-top: 1rem;
            transition: all 0.3s ease;
            color: white;
        }
        .btn-login:hover {
            background: #1e293b;
            transform: translateY(-2px);
            box-shadow: 0 10px 15px -3px rgba(15, 23, 42, 0.3);
            color: white;
        }
        .login-footer {
            margin-top: 2rem;
            text-align: center;
            color: #64748b;
            font-size: 0.85rem;
        }
        .login-footer a {
            color: #0d6efd;
            text-decoration: none;
        }
        .input-group-text-login {
            background: #f8fafc;
            border: 1px solid #e2e8f0;
            color: #64748b;
            border-radius: 12px 0 0 12px;
        }
        .form-control-login-group {
            border-radius: 0 12px 12px 0;
        }
    </style>
</head>
<body>

    <div class="login-card">
        <div class="login-logo">
            <i class="bi bi-shield-fill-check"></i>
            <p class="fs-6 text-muted fw-normal">Secure Access Management</p>
        </div>

        <form action="index.html">
            <div class="mb-4">
                <label class="login-label">Email Address</label>
                <div class="input-group">
                    <span class="input-group-text input-group-text-login"><i class="bi bi-envelope"></i></span>
                    <input type="email" class="form-control form-control-login form-control-login-group" placeholder="admin@example.com" required>
                </div>
            </div>

            <div class="mb-4">
                <div class="d-flex justify-content-between">
                    <label class="login-label">Password</label>
                </div>
                <div class="input-group">
                    <span class="input-group-text input-group-text-login"><i class="bi bi-lock"></i></span>
                    <input type="password" class="form-control form-control-login form-control-login-group" placeholder="••••••••" required>
                </div>
            </div>

            <div class="mb-4">
                <div class="form-check">
                    <input class="form-check-input" type="checkbox" id="rememberMe">
                    <label class="form-check-label text-muted small" for="rememberMe">
                        Keep me signed in
                    </label>
                </div>
            </div>

            <button type="submit" class="btn btn-primary btn-login w-100">Sign In to Dashboard</button>
        </form>

    </div>

    <!-- Bootstrap JS Bundle with Popper -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
